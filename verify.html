<!DOCTYPE html>
<html lang="en">
<head>
    <title>Verify Email</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login" style="text-align: center;">
        <h2>Verify Your Email</h2>
        <p>We've sent a confirmation notification to your email. Click below to simulate confirming your account.</p>

        <input type="email" id="verifyEmail" placeholder="Enter your email to verify" required style="margin-bottom: 15px;">
        <button id="verifyBtn" style="margin-bottom: 15px;">Confirm Email</button>

        <span><a href="index.html">Back to Login</a></span>
    </div>

    <script>
        document.getElementById('verifyBtn').addEventListener('click', function() {
            const email = document.getElementById('verifyEmail').value;
            let users = JSON.parse(localStorage.getItem('registeredUsers')) || {};

            if (users[email]) {
                users[email].isVerified = true;
                localStorage.setItem('registeredUsers', JSON.stringify(users));
                alert('Email confirmed successfully! You can now log in.');
                window.location.href = 'index.html';
            } else {
                alert('Email not found in our records.');
            }
        });
    </script>
</body>
</html>
